name: Daily Triggers

# 北京时间 21 个流量槽位。
# 现有 14 个行情/情报/观点槽位保留，新增 7 个原创短帖槽位。
# 系统软上限默认 21，平台接口硬上限为 100。
on:
  schedule:
    - cron: '5 0 * * *'     # 北京 08:05 龙头币
    - cron: '55 0 * * *'    # 北京 08:55 涨幅榜
    - cron: '50 1 * * *'    # 北京 09:50 排名异动
    - cron: '25 2 * * *'    # 北京 10:25 原创短帖
    - cron: '0 3 * * *'     # 北京 11:00 涨幅榜
    - cron: '35 3 * * *'    # 北京 11:35 原创短帖
    - cron: '10 4 * * *'    # 北京 12:10 币圈观点
    - cron: '45 4 * * *'    # 北京 12:45 原创短帖
    - cron: '20 5 * * *'    # 北京 13:20 涨幅榜
    - cron: '55 5 * * *'    # 北京 13:55 原创短帖
    - cron: '30 6 * * *'    # 北京 14:30 真实情报
    - cron: '5 7 * * *'     # 北京 15:05 原创短帖
    - cron: '40 7 * * *'    # 北京 15:40 排名异动
    - cron: '15 8 * * *'    # 北京 16:15 原创短帖
    - cron: '50 8 * * *'    # 北京 16:50 涨幅榜
    - cron: '25 9 * * *'    # 北京 17:25 原创短帖
    - cron: '0 10 * * *'    # 北京 18:00 龙头币
    - cron: '15 11 * * *'   # 北京 19:15 涨幅榜
    - cron: '30 12 * * *'   # 北京 20:30 排名异动
    - cron: '45 13 * * *'   # 北京 21:45 币圈观点
    - cron: '0 15 * * *'    # 北京 23:00 财富/人性观点
  workflow_dispatch:
    inputs:
      kind:
        description: '强制内容类型(可选: intelligence/gainers/leaders/rising/otc/hooks/wealth)'
        required: false
        default: ''
      dry_run:
        description: '只验证完整流程，不发布到币安'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Determine content track
        id: slot
        if: github.event_name == 'schedule'
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          echo "Scheduled expression: $SCHEDULE_EXPR"
          # GitHub 定时任务经常延迟十几分钟，不能用实际启动时间判断栏目。
          # 直接匹配触发它的 cron 表达式，避免所有延迟任务误落到 intelligence。
          case "$SCHEDULE_EXPR" in
            '5 0 * * *')   KIND=leaders      ;;
            '55 0 * * *')  KIND=gainers      ;;
            '50 1 * * *')  KIND=rising       ;;
            '25 2 * * *')  KIND=hooks        ;;
            '0 3 * * *')   KIND=gainers      ;;
            '35 3 * * *')  KIND=hooks        ;;
            '10 4 * * *')  KIND=hooks        ;;
            '45 4 * * *')  KIND=hooks        ;;
            '20 5 * * *')  KIND=gainers      ;;
            '55 5 * * *')  KIND=hooks        ;;
            '30 6 * * *')  KIND=intelligence ;;
            '5 7 * * *')   KIND=hooks        ;;
            '40 7 * * *')  KIND=rising       ;;
            '15 8 * * *')  KIND=hooks        ;;
            '50 8 * * *')  KIND=gainers      ;;
            '25 9 * * *')  KIND=hooks        ;;
            '0 10 * * *')  KIND=leaders      ;;
            '15 11 * * *') KIND=gainers      ;;
            '30 12 * * *') KIND=rising       ;;
            '45 13 * * *') KIND=hooks        ;;
            '0 15 * * *')  KIND=wealth       ;;
            *)             KIND=gainers      ;;
          esac
          echo "track=$KIND"
          echo "kind=$KIND" >> $GITHUB_OUTPUT

      - name: Call trigger endpoint
        env:
          BASE_URL: ${{ secrets.FBYQ_BASE_URL }}
          TRIGGER_TOKEN: ${{ secrets.FBYQ_TRIGGER_TOKEN }}
          KIND_INPUT: ${{ github.event.inputs.kind || steps.slot.outputs.kind }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          if [ -z "$BASE_URL" ] || [ -z "$TRIGGER_TOKEN" ]; then
            echo "::error ::FBYQ_BASE_URL 或 FBYQ_TRIGGER_TOKEN 未在仓库 secrets 中配置"
            exit 1
          fi

          URL="${BASE_URL%/}/api/trigger?key=${TRIGGER_TOKEN}"
          if [ -n "$KIND_INPUT" ]; then
            URL="${URL}&kind=${KIND_INPUT}"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            URL="${URL}&dryRun=true"
          fi
          echo "Triggering content track: ${KIND_INPUT:-fixed-column}"

          tmpbody=$(mktemp)
          code=$(curl -sS -o "$tmpbody" -w "%{http_code}" "$URL")
          echo "HTTP $code"
          cat "$tmpbody"
          echo
          if grep -q '"ok":true' "$tmpbody"; then
            echo "trigger ok"
          else
            echo "::error ::trigger returned ok=false; automatic publishing did not complete"
            exit 1
          fi
